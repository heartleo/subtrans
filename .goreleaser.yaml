version: 2

project_name: subtrans

before:
  hooks:
    - go mod tidy

builds:
  - id: subtrans
    main: ./cmd/subtrans
    binary: subtrans
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: subtrans
    ids:
      - subtrans
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE
      - .env.example

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Bug Fixes
      regexp: '^fix:'
    - title: Features
      regexp: '^feat:'
    - title: Documentation
      regexp: '^docs:'
    - title: Other
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^ci:'
      - '^style:'
      - '^Merge '

brews:
  - name: subtrans
    ids:
      - subtrans
    repository:
      owner: heartleo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/heartleo/subtrans"
    description: "Translate SRT subtitle files using OpenAI-compatible APIs"
    license: "MIT"
    install: |
      bin.install "subtrans"
    test: |
      system "#{bin}/subtrans", "--version"

winget:
  - name: subtrans
    package_identifier: heartleo.subtrans
    publisher: heartleo
    publisher_url: "https://github.com/heartleo"
    homepage: "https://github.com/heartleo/subtrans"
    short_description: "Translate SRT subtitle files using OpenAI-compatible APIs"
    license: MIT
    tags:
      - subtitles
      - translation
      - srt
      - openai
      - cli
    repository:
      owner: heartleo
      name: winget-pkgs
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

release:
  draft: true
  replace_existing_draft: true
